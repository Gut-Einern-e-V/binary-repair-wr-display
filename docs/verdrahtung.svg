<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530"
     font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="980" height="530" fill="#14171a" rx="10"/>

  <text x="28" y="40" fill="#e6edf3" font-size="20" font-weight="600">Verdrahtung</text>
  <text x="28" y="62" fill="#9aa7b2" font-size="13">Binäranzeige Reparaturrekord NRW · zwei Streifen à 8 LEDs = 16 Bit</text>

  <!-- ================= ESP32 ================= -->
  <rect x="40" y="96" width="170" height="190" rx="8" fill="#232a31" stroke="#4a5560" stroke-width="2"/>
  <text x="125" y="128" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">ESP32 DevKit</text>
  <text x="125" y="148" fill="#9aa7b2" font-size="11" text-anchor="middle">z. B. WROOM-32</text>

  <text x="198" y="175" fill="#9aa7b2" font-size="12" text-anchor="end">5V / VIN</text>
  <text x="198" y="215" fill="#e6edf3" font-size="12" text-anchor="end">GPIO 5</text>
  <text x="198" y="255" fill="#e6edf3" font-size="12" text-anchor="end">GND</text>
  <circle cx="210" cy="170" r="4" fill="#4a5560"/>
  <circle cx="210" cy="210" r="4" fill="#00ff66"/>
  <circle cx="210" cy="250" r="4" fill="#9aa7b2"/>

  <text x="40" y="308" fill="#9aa7b2" font-size="11">GPIO 0 = BOOT-Taster, schon auf dem Board</text>
  <text x="40" y="325" fill="#9aa7b2" font-size="11">kurz = Effekt · lang = Konfigurationsportal</text>
  <text x="40" y="348" fill="#9aa7b2" font-size="11">5V / VIN nur nötig, wenn der ESP32 nicht</text>
  <text x="40" y="363" fill="#9aa7b2" font-size="11">über USB versorgt wird</text>

  <!-- ================= Datenleitung ================= -->
  <path d="M210 210 H266" stroke="#00ff66" stroke-width="2.5" fill="none"/>
  <rect x="266" y="200" width="58" height="20" rx="3" fill="#232a31" stroke="#00ff66" stroke-width="2"/>
  <text x="295" y="192" fill="#00ff66" font-size="11" text-anchor="middle">330 Ω</text>
  <path d="M324 210 H365 V150 H410" stroke="#00ff66" stroke-width="2.5" fill="none"/>

  <!-- ================= Streifen 1 ================= -->
  <text x="515" y="100" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">Streifen 1 · Bits 0–7</text>
  <text x="412" y="121" fill="#00ff66" font-size="11">DIN</text>
  <text x="618" y="121" fill="#00ff66" font-size="11" text-anchor="end">DOUT</text>
  <rect x="410" y="128" width="210" height="44" rx="6" fill="#232a31" stroke="#4a5560" stroke-width="2"/>
  <g fill="#3a444d">
    <circle cx="426" cy="150" r="7"/><circle cx="450" cy="150" r="7"/>
    <circle cx="474" cy="150" r="7"/><circle cx="498" cy="150" r="7"/>
    <circle cx="522" cy="150" r="7"/><circle cx="546" cy="150" r="7"/>
    <circle cx="570" cy="150" r="7"/><circle cx="594" cy="150" r="7"/>
  </g>

  <!-- Verbindung zwischen den Streifen -->
  <path d="M620 150 H655" stroke="#00ff66" stroke-width="2.5" fill="none"/>

  <!-- ================= Streifen 2 ================= -->
  <text x="760" y="100" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">Streifen 2 · Bits 8–15</text>
  <text x="657" y="121" fill="#00ff66" font-size="11">DIN</text>
  <text x="863" y="121" fill="#00ff66" font-size="11" text-anchor="end">DOUT</text>
  <rect x="655" y="128" width="210" height="44" rx="6" fill="#232a31" stroke="#4a5560" stroke-width="2"/>
  <g fill="#3a444d">
    <circle cx="671" cy="150" r="7"/><circle cx="695" cy="150" r="7"/>
    <circle cx="719" cy="150" r="7"/><circle cx="743" cy="150" r="7"/>
    <circle cx="767" cy="150" r="7"/><circle cx="791" cy="150" r="7"/>
    <circle cx="815" cy="150" r="7"/><circle cx="839" cy="150" r="7"/>
  </g>

  <!-- Fortsetzung: weitere Streifen -->
  <path d="M865 150 H930" stroke="#00ff66" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
  <text x="897" y="190" fill="#9aa7b2" font-size="11" text-anchor="middle">jeder weitere</text>
  <text x="897" y="205" fill="#9aa7b2" font-size="11" text-anchor="middle">Streifen = 8 Bit</text>

  <!-- ================= Netzteil ================= -->
  <rect x="40" y="380" width="170" height="80" rx="8" fill="#232a31" stroke="#4a5560" stroke-width="2"/>
  <text x="125" y="410" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">5-V-Netzteil</text>
  <text x="125" y="430" fill="#9aa7b2" font-size="11" text-anchor="middle">ca. 60 mA je LED</text>
  <text x="198" y="404" fill="#ff6b4a" font-size="12" text-anchor="end">+</text>
  <text x="198" y="444" fill="#9aa7b2" font-size="12" text-anchor="end">−</text>

  <!-- Stromschienen -->
  <path d="M210 400 H292 A8 8 0 0 1 308 400 H572 A8 8 0 0 1 588 400 H817 A8 8 0 0 1 833 400 H900" stroke="#ff6b4a" stroke-width="2.5" fill="none"/>
  <path d="M210 440 H900" stroke="#9aa7b2" stroke-width="2.5" fill="none"/>
  <text x="908" y="404" fill="#ff6b4a" font-size="11">5 V</text>
  <text x="908" y="444" fill="#9aa7b2" font-size="11">GND</text>

  <!-- gemeinsame Masse vom ESP32 -->
  <path d="M210 250 H300 V440" stroke="#9aa7b2" stroke-width="2.5" fill="none"/>
  <circle cx="300" cy="440" r="4.5" fill="#9aa7b2"/>

  <!-- Stichleitungen zu den Streifen -->
  <path d="M445 172 V400" stroke="#ff6b4a" stroke-width="2.5" fill="none"/>
  <path d="M580 172 V440" stroke="#9aa7b2" stroke-width="2.5" fill="none"/>
  <path d="M690 172 V400" stroke="#ff6b4a" stroke-width="2.5" fill="none"/>
  <path d="M825 172 V440" stroke="#9aa7b2" stroke-width="2.5" fill="none"/>
  <circle cx="445" cy="400" r="4.5" fill="#ff6b4a"/>
  <circle cx="690" cy="400" r="4.5" fill="#ff6b4a"/>
  <circle cx="580" cy="440" r="4.5" fill="#9aa7b2"/>
  <circle cx="825" cy="440" r="4.5" fill="#9aa7b2"/>

  <!-- Elko zwischen 5 V und GND am ersten Streifen -->
  <path d="M445 250 H497" stroke="#ff6b4a" stroke-width="2.5" fill="none"/>
  <path d="M503 250 H580" stroke="#9aa7b2" stroke-width="2.5" fill="none"/>
  <path d="M497 236 V264" stroke="#e6edf3" stroke-width="3" fill="none"/>
  <path d="M503 236 V264" stroke="#e6edf3" stroke-width="3" fill="none"/>
  <circle cx="445" cy="250" r="4.5" fill="#ff6b4a"/>
  <circle cx="580" cy="250" r="4.5" fill="#9aa7b2"/>
  <text x="500" y="228" fill="#e6edf3" font-size="11" text-anchor="middle">1000 µF</text>
  <text x="500" y="284" fill="#9aa7b2" font-size="10" text-anchor="middle">direkt am ersten Streifen</text>

  <!-- ================= Hinweise ================= -->
  <text x="28" y="492" fill="#ff9d5c" font-size="12">
    GND von ESP32 und Netzteil müssen verbunden sein — sonst hat die Datenleitung keinen Bezug und der Streifen flackert.
  </text>
  <text x="28" y="512" fill="#9aa7b2" font-size="12">
    Der ESP32 gibt 3,3 V auf die Datenleitung, WS28xx erwarten 5 V. Läuft meist trotzdem; bei Aussetzern Pegelwandler (74AHCT125) einsetzen.
  </text>
</svg>
